services:
  omni:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    environment: { HOST: 0.0.0.0, IMESSAGE: "0" }
    ports: ["4747:4747"]
    volumes:
      - ../data:/app/data
      - ../cartridges:/app/cartridges
      - ../modes:/app/modes
      - ../workspace:/app/workspace
    restart: unless-stopped
