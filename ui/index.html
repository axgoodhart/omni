<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omni</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <strong class="brand">omni</strong>
  <label class="field" title="A mode is a personality: its own prompt, tools, permissions and memory, with one ongoing conversation.">Mode <select id="mode"></select></label>
  <span id="model-label" class="muted"></span>
  <span class="spacer"></span>
  <span id="imessage-label" class="muted"></span>
  <div class="budget" title="Free OpenAI tokens used today. Past 85% the agent switches to the light model; at 100% it stops until midnight UTC."><div id="budget-fill"></div><span id="budget-text">–</span></div>
  <span id="status" class="status">connecting…</span>
</header>
<main class="grid">
  <section class="pane" id="thread-pane">
    <h2>Conversation <span class="sub">one thread per mode, shared with iMessage</span> <button id="reset" class="ghost" title="Forget this mode's conversation. Memory cartridges are kept.">forget</button></h2>
    <div id="banner"></div>
    <div id="messages" class="scroll"></div>
    <form id="composer"><textarea id="input" rows="2" placeholder="Say something… (Enter sends, Shift+Enter for a new line)"></textarea><button id="send">Send</button></form>
  </section>
  <section class="pane" id="operation-pane">
    <h2>Operation <span class="sub">every step the agent takes, as it happens</span> <span id="counter" class="muted"></span></h2>
    <div id="filters" class="filters"></div>
    <div id="live" class="live"></div>
    <div id="events" class="scroll"></div>
  </section>
  <aside class="pane" id="side-pane">
    <nav class="tabs" id="tabs">
      <button data-tab="approvals">Approvals <span id="approval-count" class="pill"></span></button>
      <button data-tab="mode">Mode</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="more">More</button>
    </nav>
    <div class="tab scroll" id="tab-approvals"></div>
    <div class="tab scroll" id="tab-mode" hidden></div>
    <div class="tab scroll" id="tab-memory" hidden></div>
    <div class="tab scroll" id="tab-more" hidden></div>
  </aside>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
